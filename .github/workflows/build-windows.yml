name: Build Windows executable

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller==6.22.3
      - name: Build executable
        run: pyinstaller --noconfirm --clean --windowed --onefile --name AP1-Trainer main.py
      - name: Upload executable artifact
        uses: actions/upload-artifact@v4
        with:
          name: AP1-Trainer-Windows
          path: dist/AP1-Trainer.exe
          if-no-files-found: error
          retention-days: 30
      - name: Publish executable on GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$env:GITHUB_REF_NAME" "dist/AP1-Trainer.exe" --title "$env:GITHUB_REF_NAME" --generate-notes
